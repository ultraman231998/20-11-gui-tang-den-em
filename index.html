<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thiệp 20/11 Mini Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Dancing+Script:wght@500;700&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* 4 mini game trong một "ca trực 20/11": Ô chữ, Đóng dấu, Xe Hòa Lạc, Bàn làm việc.
   Chơi xong cả 4 thì mở khoá In bằng khen và thư tay. Không game nào có thể thua. */
:root{
  --bg:#fbf4e6; --bg2:#f3e4d4; --ink:#2b1b22; --muted:#7a6169;
  --rose:#c2385a; --rose-soft:#fde3ea; --red:#d0263e; --navy:#2d3e6b;
  --ok:#2f9e6a; --paper:#fffaf0; --gold:#c99a45;
  --f-body:"Be Vietnam Pro",system-ui,sans-serif;
  --f-hand:"Dancing Script","Segoe Script",cursive;
  --f-serif:"Noto Serif",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
button{font-family:inherit}
body{color:var(--ink);font:15px/1.5 var(--f-body);background:
  linear-gradient(90deg,transparent 0 56px,rgba(214,120,120,.18) 56px 57.5px,transparent 57.5px),
  repeating-linear-gradient(0deg,rgba(120,140,190,.09) 0 1px,transparent 1px 28px),
  repeating-linear-gradient(90deg,rgba(120,140,190,.05) 0 1px,transparent 1px 28px),
  linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed}
body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;background:radial-gradient(circle at 28% 30%,rgba(255,214,150,.55),transparent 40%),radial-gradient(circle at 74% 70%,rgba(255,190,190,.4),transparent 42%);animation:glow 26s ease-in-out infinite alternate}
@keyframes glow{to{transform:translate(7%,5%) rotate(8deg)}}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:22px 16px 36px;display:flex;flex-direction:column;gap:16px;align-items:center}
/* tiêu đề: tem ngày + dòng chữ viết tay hiện dần, màu đỏ đô ánh vàng, gạch chân vẽ tay */
.top{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.top .d{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:11.5px;letter-spacing:.22em;font-weight:700;color:#a3304d;
  background:rgba(255,255,255,.75);border:1px dashed #e0b977;border-radius:999px;padding:4px 14px 4px 8px;box-shadow:0 4px 12px rgba(160,110,40,.12);animation:drop .7s cubic-bezier(.22,1,.36,1) both}
.top .dz{font-size:15px;display:inline-block;animation:spin 10s linear infinite}
.top .dl{letter-spacing:.04em;font-weight:600;color:#a07a45;padding-left:9px;border-left:1px solid #e8d2a8}
.top h1{position:relative;margin:0;font-family:var(--f-hand);font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.25;padding:0 .2em .15em;text-wrap:balance;
  background:linear-gradient(100deg,#7c1f3c 0%,#b8304f 28%,#e0973a 50%,#b8304f 72%,#7c1f3c 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(255,255,255,.85));
  animation:write 1.9s cubic-bezier(.6,0,.3,1) .25s both,shine 7s ease-in-out 2.4s infinite}
.top h1 .hl{font-size:1.14em}
.top h1 .hs{opacity:.55;margin:0 .1em}
.top h1 .hb{display:inline-block;font-size:.55em;vertical-align:.7em;margin-left:.15em;color:#e2486c;-webkit-text-fill-color:#e2486c;animation:hbeat 1.6s ease-in-out 2.2s infinite}
.top h1 .sw{position:absolute;left:10%;bottom:-4px;width:80%;height:12px;overflow:visible}
.top h1 .sw path{fill:none;stroke:#e0b977;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out 1.9s forwards}
@keyframes write{from{clip-path:inset(-30% 100% -30% 0)}to{clip-path:inset(-30% -6% -30% 0)}}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hbeat{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(.95)}45%{transform:scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@media (max-width:520px){.top .dl{display:none}}

.pc{width:100%;height:clamp(680px,calc(100vh - 130px),1080px);background:#fff;border-radius:14px;border:1px solid #e8d8c4;box-shadow:0 30px 70px rgba(110,70,30,.18);display:flex;flex-direction:column;overflow:hidden;position:relative}
.titlebar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 0 34px;position:relative;background:linear-gradient(180deg,#fff6e3,#fbe9c9);border-bottom:2px solid #efd3a0}
.titlebar::before{content:"";position:absolute;left:10px;top:7px;bottom:7px;width:10px;background:radial-gradient(circle at 50% 50%,#c9a46a 0 2.5px,transparent 3px) 0 0/10px 9px repeat-y}
.tb-l{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.tb-ic{font-size:17px;align-self:center}
.tb-l b{font-family:var(--f-hand);font-size:22px;color:#8a2442;line-height:1}
.tb-l em{font-style:normal;font-size:12.5px;color:#a07a45;overflow:hidden;text-overflow:ellipsis}
.tb-date{font-size:12px;font-weight:700;letter-spacing:.06em;color:#8a5a1a;background:#fff;border:1px dashed #e0b977;border-radius:999px;padding:3px 11px;white-space:nowrap}
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px clamp(12px,3vw,32px) 30px;background:#fffdf8;position:relative}
.scr{max-width:940px;margin:0 auto;animation:turnIn .6s cubic-bezier(.22,1,.36,1);transform-origin:left center}
@keyframes in{from{opacity:0;transform:scale(.96)}}
@media (max-width:620px){.tb-l em{display:none}.tb-date{font-size:11px;padding:2px 8px}}

.btn{font:600 14px var(--f-body);border:0;border-radius:999px;padding:10px 20px;background:var(--rose);color:#fff;cursor:pointer;transition:transform .15s,box-shadow .2s;touch-action:manipulation}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(194,56,90,.3)}
.btn.ghost{background:#fff;color:#8a2442;border:1px solid #e6c3cf}
.btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #e0b977;outline-offset:2px}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.ghd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.back{border:0;background:none;color:#8a6a2a;font:600 13px var(--f-body);cursor:pointer;padding:4px 0}
.ghd .st{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghd .st b{color:var(--rose)}
h2{font-size:21px;color:#8a2442;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.wish{margin-top:16px;padding:16px 18px;border-radius:16px;background:var(--rose-soft);border:1px solid #f6c3d1;text-align:center;animation:in .5s}
.wish small{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:700}
.wish div{font-family:var(--f-hand);font-size:clamp(21px,4.6vw,25px);line-height:1.35;color:#7c2238;margin-top:4px;text-wrap:balance}

/* bảng ô chữ: tờ giấy trắng làm nền để lưới chữ không bị "trôi" */
.board{background:#fff;border:1px solid #f0e0c8;border-radius:20px;padding:clamp(14px,3vw,28px) clamp(10px,2.5vw,26px);box-shadow:0 12px 30px rgba(110,70,30,.08);
  background-image:radial-gradient(circle at 100% 0,rgba(255,214,150,.25),transparent 40%)}
.board .cw{margin:0}
#kw .wish{max-width:460px;margin:12px auto 0}
/* icon con dấu vẽ bằng CSS, thay cho emoji */
.ico-stamp{display:inline-grid;place-items:center;width:1.1em;height:1.1em;border-radius:50%;border:3px double var(--red);color:var(--red);font-size:.85em;font-weight:800;line-height:1;transform:rotate(-12deg);background:#fff}
.linkbtn{background:none;border:0;color:#8a6a2a;font:500 13px var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 8px}
.linkbtn:hover{color:var(--rose)}
/* đóng dấu xong: xấp giấy xoè ra giữa khung */
.arena.fin{cursor:default}
.arena.fin .aim,.arena.fin .stp{opacity:0;transition:opacity .4s}
.pile{position:absolute;inset:0;z-index:2}
.pile .sheet{left:50%;top:50%;transform:var(--t);animation:pileIn .55s cubic-bezier(.22,1,.36,1) both;box-shadow:0 10px 22px rgba(110,70,30,.18)}
.pile .sheet:last-child{z-index:2;outline:2px solid #e0b977;outline-offset:2px}
@keyframes pileIn{from{opacity:0;transform:translate(-50%,-10%) scale(.8)}}
/* bàn làm việc: tìm đủ thì bàn mờ đi, mảnh giấy trong hộp quà hiện ra giữa bàn, có băng dính */
.desk.fin .it,.desk.fin .pp{filter:blur(2px) brightness(.8);transition:filter .7s}
.desknote{position:absolute;left:50%;top:50%;width:min(80%,440px);z-index:10;transform:translate(-50%,-50%) rotate(-2deg);animation:noteIn .8s cubic-bezier(.3,1.4,.5,1) both}
.desknote::before{content:"";position:absolute;top:-13px;left:50%;width:96px;height:26px;margin-left:-48px;z-index:2;background:rgba(255,222,150,.8);transform:rotate(3deg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.desknote .wish{margin:0;background:#fffdf3;border:0;border-radius:6px;padding:24px 22px 20px;box-shadow:0 20px 44px rgba(60,30,10,.4);
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,#f0e2cf 33px 34px)}
@keyframes noteIn{from{opacity:0;transform:translate(-50%,-20%) rotate(-12deg) scale(.5)}}
/* tổng kết ca trực ở màn in bằng */
.recap{margin-top:14px;background:#fff;border:1px solid #f0e0c8;border-radius:16px;padding:14px;box-shadow:0 8px 20px rgba(110,70,30,.06)}
.recap>small{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#a07a45;font-weight:700;margin-bottom:6px}
.rc{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #f0e0c8;animation:in .5s both}
.rc .e{font-size:24px;text-align:center}
.rc b{display:block;font-size:14px}
.rc em{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.rc i{font-style:normal;font-weight:800;color:#fff;background:var(--ok);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.recap p{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.recap p span{font-family:var(--f-hand);font-size:19px;color:var(--rose)}
.recap p b{color:var(--ok)}
/* màn bìa mở thiệp */
.cover{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:20px;text-align:center;
  background:radial-gradient(circle at 50% 35%,#fffaf0,#fbe6cf 70%,#f6d6b8);transition:opacity .6s,transform .6s}
.cover.off{opacity:0;transform:scale(1.04);pointer-events:none}
.cv-in{display:grid;justify-items:center;gap:6px;animation:in .7s cubic-bezier(.22,1,.36,1)}
.cv-env{font-size:clamp(64px,12vw,96px);line-height:1;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(194,56,90,.25))}
@keyframes float{50%{transform:translateY(-10px) rotate(-4deg)}}
.cover small{font-size:12px;letter-spacing:.3em;font-weight:700;color:var(--rose);margin-top:6px}
.cover h2{font-family:var(--f-hand);font-size:clamp(30px,6vw,44px);line-height:1.2;color:#8a2442;margin:0 0 16px}
.cover .btn{margin-top:18px}
/* lời dẫn sang game tiếp theo */
.guide{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:14px;background:#fff7ea;border:1px dashed #e0b977;animation:in .5s .4s both}
.guide .gi{font-size:30px;line-height:1;animation:nudge 2.6s ease-in-out infinite}
.guide small{display:block;font-size:12px;font-weight:700;color:#a06a00}
.guide p{margin:2px 0 0;font-size:14.5px}
.guide.last{background:#fff4f6;border-color:#e8a3b6}
.guide.last small{color:var(--rose)}
.btn.big{font-size:17px;padding:14px 30px;animation:glowbtn 1.6s ease-in-out infinite}
@keyframes glowbtn{50%{box-shadow:0 0 0 8px rgba(194,56,90,.15)}}
@keyframes nudge{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
/* sảnh */
.hello{text-align:center;margin-bottom:16px}
.hello .big{font-size:46px;line-height:1}
.prog{height:9px;border-radius:99px;background:#f1e6d4;overflow:hidden;margin:10px auto 4px;max-width:360px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),#f08aa0);border-radius:99px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:4px}
.gc{display:grid;gap:4px;text-align:left;border:1px solid #f0e0c8;background:#fff;border-radius:16px;padding:14px;cursor:pointer;font:inherit;color:inherit;transition:transform .2s,box-shadow .2s;position:relative}
.gc:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(110,70,30,.1)}
.gc .e{font-size:30px;line-height:1.1}
.gc b{font-size:15px}.gc small{color:var(--muted);font-size:12.5px}
.gc .chip{justify-self:start;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:#fff1d6;color:#a06a00;margin-top:4px}
.gc.done .chip{background:#dff4e9;color:var(--ok)}
.gc.final{border:1.5px dashed #e8a3b6;background:#fff7f9;grid-column:1/-1;text-align:center;justify-items:center}
.gc.lock{opacity:.55;cursor:not-allowed}

/* 1. ô chữ */
.cw{--cs:min(40px,calc((100vw - 90px)/14));display:grid;gap:3px;justify-content:center;margin:6px 0 14px}
.cwr{display:grid;grid-template-columns:20px repeat(var(--cols),var(--cs));gap:3px;align-items:center}
.cwr .n{font-size:11px;color:#a08a70;font-weight:700;text-align:center}
.cell{width:var(--cs);height:var(--cs);border-radius:5px;background:#fff;border:1.5px solid #e6d3b5;display:grid;place-items:center;font:800 calc(var(--cs)*.52) var(--f-body);color:var(--navy);perspective:300px}
.cell.k{border-color:var(--rose);background:#fff5f7}
.cell.empty{background:none;border:0}
.cwr.cur .cell:not(.empty){border-color:#e0b977;box-shadow:0 0 0 2px rgba(224,185,119,.35)}
.cell span{opacity:0;transform:rotateX(90deg);transition:opacity .3s,transform .35s}
.cell.show span{opacity:1;transform:none}
.cell.k.glow{background:var(--rose);color:#fff;border-color:var(--rose);animation:pulse .6s}
@keyframes pulse{50%{transform:scale(1.2)}}
.clue{background:#fff7ea;border:1px solid #f1dfbf;border-radius:14px;padding:14px;text-align:center}
.clue p{margin:0 0 10px;font-size:15px}
.clue small{color:#a07a45;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.opts button{font:700 14px var(--f-body);border:1px solid #e6c3cf;background:#fff;color:#8a2442;border-radius:12px;padding:9px 14px;cursor:pointer}
.opts button.no{animation:shake .35s;border-color:#e88;color:#b55}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.keyword{font:800 clamp(34px,9vw,52px) var(--f-body);letter-spacing:.18em;color:var(--rose);text-align:center;animation:pulse .8s}

/* 2. đóng dấu */
.arena{position:relative;height:300px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#f6ead8 0 68%,#d9c3a2 68% 100%);border:1px solid #ead8bd;cursor:pointer;user-select:none;touch-action:manipulation}
.arena::after{content:"";position:absolute;left:0;right:0;top:68%;height:4px;background:repeating-linear-gradient(90deg,#b99a70 0 14px,transparent 14px 24px)}
.stp{position:absolute;left:50%;top:6px;width:64px;margin-left:-32px;z-index:3;transition:transform .14s ease-in}
.stp .hd{width:26px;height:34px;margin:0 auto;border-radius:12px 12px 4px 4px;background:linear-gradient(90deg,#7a4a2a,#a86c3e,#7a4a2a)}
.stp .bs{height:16px;border-radius:4px;background:linear-gradient(180deg,#5b3a22,#3a2414);box-shadow:0 3px 0 var(--red)}
.stp.hit{transform:translateY(118px)}
.aim{position:absolute;left:50%;top:0;bottom:32%;width:0;border-left:2px dashed rgba(208,38,62,.25);z-index:1}
.sheet{position:absolute;top:96px;width:170px;height:140px;background:#fff;border-radius:6px;box-shadow:0 6px 14px rgba(110,70,30,.15);padding:10px;z-index:2;font-size:11.5px}
.sheet b{display:block;font-size:12.5px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet i{display:block;height:4px;border-radius:3px;background:#eee4d6;margin-top:6px}
.sheet .tg{position:absolute;left:55px;top:56px;width:60px;height:60px;border:2px dashed #e0a0b0;border-radius:50%}
.sheet.out{transition:transform .5s ease-in,opacity .5s;transform:translateY(-30px) rotate(-6deg);opacity:0}
.mark{position:absolute;top:56px;width:60px;height:60px;border-radius:50%;border:3px double var(--red);color:var(--red);display:grid;place-items:center;font:800 9px/1.15 var(--f-body);text-align:center;opacity:.85;animation:mk .25s}
@keyframes mk{from{transform:scale(1.6);opacity:0}}
.rate{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font:800 26px var(--f-body);color:var(--rose);z-index:4;text-shadow:0 2px 0 #fff;animation:rate .9s forwards;pointer-events:none;white-space:nowrap}
@keyframes rate{from{transform:translate(-50%,-20%) scale(.6);opacity:0}30%{transform:translate(-50%,-50%) scale(1.1);opacity:1}to{transform:translate(-50%,-90%);opacity:0}}
.log{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.log span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#f1e6d4;color:#8a6a2a}
.log span.p{background:var(--rose);color:#fff}

/* 3. xe Hòa Lạc */
/* lề đường cỏ xanh, hàng cây hai bên chạy lùi khi xe chạy */
.roadwrap{position:relative;width:min(540px,100%);margin:0 auto;padding:0 clamp(26px,6vw,46px);border-radius:22px;overflow:hidden;
  background:linear-gradient(90deg,#9fd29a,#b7e0ae 50%,#9fd29a);box-shadow:0 12px 28px rgba(60,90,60,.15)}
.roadwrap::before,.roadwrap::after{content:"";position:absolute;top:-90px;bottom:-90px;width:clamp(26px,6vw,46px);
  background:radial-gradient(circle at 50% 30%,#4f9e5c 0 10px,#6fbf74 11px 13px,transparent 14px) 0 0/100% 90px repeat-y,
             radial-gradient(circle at 30% 75%,#f7d36a 0 3px,transparent 4px) 0 0/100% 90px repeat-y}
.roadwrap::before{left:0}.roadwrap::after{right:0;background-position:0 45px,0 20px}
.roadwrap.go::before,.roadwrap.go::after{animation:trees .9s linear infinite}
@keyframes trees{to{transform:translateY(90px)}}
.road{position:relative;width:100%;height:min(560px,64vh);margin:0 auto;overflow:hidden;background:#5d6170;box-shadow:inset 5px 0 0 #e9e9ef,inset -5px 0 0 #e9e9ef;touch-action:none;user-select:none;cursor:ew-resize}
.road.arrive{cursor:default}
.road.arrive .bus{bottom:34%;transition:bottom 1.8s cubic-bezier(.22,1,.36,1),left .3s}
.gate{position:absolute;left:10%;right:10%;top:7%;z-index:6;background:#fff;border:3px solid var(--navy);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:0 12px 24px rgba(0,0,0,.25);animation:in .6s .5s both}
.gate .gs{font:800 clamp(18px,4vw,24px) var(--f-body);letter-spacing:.14em;color:var(--navy)}
.gate .wish{margin:6px 0 0;padding:0;background:none;border:0;animation:none}
.gate .wish div{font-size:clamp(18px,3.6vw,22px)}
#ddw .wish{max-width:520px;margin:12px auto 0}
.road .ln{position:absolute;top:-40px;bottom:-40px;width:4px;margin-left:-2px;background:repeating-linear-gradient(180deg,#fff 0 22px,transparent 22px 44px);opacity:.7}
.road .ln.a{left:33.33%}.road .ln.b{left:66.66%}
.road.go .ln{animation:lane .5s linear infinite}
@keyframes lane{to{transform:translateY(44px)}}
.ob{position:absolute;width:33.33%;text-align:center;font-size:36px;line-height:1;transform:translateY(-50%)}
.bus{position:absolute;bottom:10px;width:33.33%;text-align:center;font-size:48px;line-height:1;transition:left .15s ease-out}
.bus.bump{animation:shake .3s 2}
.kmbar{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--navy);margin:0 auto 8px;width:min(540px,100%)}
.kmp{height:6px;border-radius:99px;background:#e6e9f3;margin:0 auto 8px;width:min(540px,100%);overflow:hidden}
.kmp i{display:block;height:100%;width:0;background:var(--navy)}
.ctl{display:flex;gap:12px;justify-content:center;margin-top:10px}
.ctl button{width:72px;height:52px;border-radius:14px;border:1px solid #d3d9ea;background:#fff;font-size:22px;cursor:pointer;touch-action:manipulation}

/* 4. bàn làm việc */
.need{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.need span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:#f1e6d4;color:#6b5030;font-weight:600}
.need span.got{background:#dff4e9;color:var(--ok);text-decoration:line-through}
.desk{position:relative;aspect-ratio:4/3;max-height:68vh;margin:0 auto;border-radius:16px;overflow:hidden;
  background:repeating-linear-gradient(92deg,rgba(0,0,0,.035) 0 3px,transparent 3px 19px),linear-gradient(160deg,#c89566,#a8734a);box-shadow:inset 0 0 40px rgba(60,30,10,.35)}
.desk .pp{position:absolute;background:#fffdf6;border-radius:3px;box-shadow:0 3px 8px rgba(60,30,10,.25);pointer-events:none}
.desk .pp::before{content:"";position:absolute;inset:14% 12%;background:repeating-linear-gradient(180deg,#e7ddcb 0 2px,transparent 2px 9px)}
.it{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));font-size:calc(clamp(22px,4.6vw,44px)*var(--s,1));line-height:1;border:0;background:none;padding:4px;cursor:pointer;touch-action:manipulation}
.it.no{animation:wob .35s}
@keyframes wob{25%{transform:translate(-50%,-50%) rotate(-12deg)}75%{transform:translate(-50%,-50%) rotate(12deg)}}
.it.got{animation:got .5s forwards;pointer-events:none}
@keyframes got{50%{transform:translate(-50%,-50%) scale(1.6)}to{transform:translate(-50%,-50%) scale(1.2);opacity:.25}}
.it.got::after{content:"✓";position:absolute;right:-4px;top:-6px;font:800 14px var(--f-body);color:var(--ok)}

/* bằng khen + máy in */
.dip{position:relative;background:var(--paper);padding:clamp(18px,4vw,30px) clamp(16px,4vw,34px);text-align:center;border:7px solid transparent;border-radius:6px;
  background-image:linear-gradient(var(--paper),var(--paper)),linear-gradient(135deg,#d9b56c,#f3e2b0,#c99a45,#f3e2b0);background-origin:border-box;background-clip:padding-box,border-box;
  box-shadow:0 14px 30px rgba(110,70,30,.14),inset 0 0 0 1px rgba(201,154,69,.5);font-family:var(--f-serif)}
.dip::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,154,69,.45);border-radius:3px;pointer-events:none}
.dip .sch{font-size:clamp(11px,2.4vw,13px);letter-spacing:.14em;color:#8a6a2a;text-transform:uppercase}
.dip h3{margin:6px 0 4px;font-size:clamp(26px,6.5vw,38px);letter-spacing:.14em;color:#8a2442}
.dip .to{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.dip .nm{font-family:var(--f-hand);font-size:clamp(32px,7vw,44px);color:#7c2238;line-height:1.2}
.dip p{font-size:clamp(13.5px,3vw,15px);line-height:1.6;margin:10px auto 0;max-width:500px;text-wrap:pretty}
.dip .form{font-family:var(--f-body);font-size:12.5px;color:#9a7a3a;font-weight:600;margin-top:10px}
.dip .dfoot{margin-top:18px;font-size:clamp(12px,2.6vw,13.5px);text-align:left}
.dip .sig{font-family:var(--f-hand);font-size:24px;color:var(--rose);line-height:1.1}
.seal{position:absolute;right:clamp(14px,6vw,56px);bottom:clamp(18px,4vw,30px);width:76px;height:76px;border-radius:50%;border:3px double var(--red);color:var(--red);display:grid;place-items:center;font:800 9.5px/1.25 var(--f-body);text-align:center;transform:rotate(-14deg) scale(2.2);opacity:0;transition:opacity .25s,transform .45s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.seal.on{opacity:.85;transform:rotate(-14deg) scale(1)}
.printer{position:relative;max-width:720px;margin:0 auto}
.pr-top{height:70px;border-radius:16px 16px 8px 8px;background:linear-gradient(180deg,#5c6890,#3b4770);position:relative;z-index:2;box-shadow:0 10px 20px rgba(45,62,107,.25)}
.pr-top::after{content:"";position:absolute;left:5%;right:5%;bottom:10px;height:6px;border-radius:4px;background:#1f2742}
.pr-top .led{position:absolute;right:18px;top:16px;width:9px;height:9px;border-radius:50%;background:#7de0a8;box-shadow:0 0 8px #7de0a8}
.pr-top .lbl{position:absolute;left:18px;top:12px;font:600 11px var(--f-body);color:#c9d0ea;letter-spacing:.1em}
.pr-top.busy .led{animation:blink .4s infinite}
@keyframes blink{50%{opacity:.2}}
.printer .dip{margin:-16px 6.5% 0;z-index:1;clip-path:inset(0 0 100% 0);transform:translateY(-50px);transition:clip-path 3.4s linear,transform 3.4s linear}
.printer .dip.out{clip-path:inset(0 0 -40px 0);transform:none}

.toast{position:absolute;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:30;background:#3b2a30;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.confetti{position:absolute;top:-10px;width:8px;height:12px;z-index:35;pointer-events:none;animation:fall 2.4s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translateY(760px) rotate(540deg);opacity:0}}
.ov{position:absolute;inset:0;z-index:40;background:radial-gradient(circle at 50% 35%,#fff3e3,#f3c9b8 75%);opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s;overflow:hidden}
.ov.on{opacity:1;visibility:visible;transition:opacity .45s}
.note{position:absolute;inset:22px max(14px,calc(50% - 300px)) 76px;border-radius:14px;background:var(--paper);box-shadow:0 20px 50px rgba(120,60,30,.25);padding:22px 20px;display:flex;flex-direction:column;overflow-y:auto}
.typed{font-family:var(--f-hand);font-size:21px;line-height:30px;color:#7c2238;white-space:pre-wrap;flex:1;background-image:repeating-linear-gradient(to bottom,transparent 0 25px,#f0d9c8 25px 26px,transparent 26px 30px)}
.sign{align-self:flex-end;font-family:var(--f-hand);font-size:22px;color:var(--rose);margin-top:6px;opacity:0;transition:opacity .6s}
.sign.show{opacity:1}
.close{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.close.show{opacity:1;pointer-events:auto}
.close:hover{transform:translateX(-50%) translateY(-1px)}
.heart{position:absolute;bottom:-20px;color:#e2486c;animation:floatUp 3.4s cubic-bezier(.4,0,.6,1) forwards;z-index:45;pointer-events:none}
@keyframes floatUp{to{transform:translateY(-760px) rotate(25deg);opacity:0}}
.tb-r{display:flex;align-items:center;gap:8px}
/* nút nhạc nền: 3 vạch nhún nhảy khi đang phát */
.mus{display:flex;align-items:center;gap:6px;font:600 12px var(--f-body);border:1px solid #ecc9d4;background:#fff;color:#a3255a;border-radius:999px;padding:3px 11px 3px 9px;cursor:pointer;white-space:nowrap}
.mus em{font-style:normal}
.eq{display:flex;align-items:flex-end;gap:2px;height:11px}
.eq u{display:block;width:2.5px;height:4px;background:var(--rose);border-radius:2px}
.mus.on .eq u{animation:eq 1s ease-in-out infinite}
.mus.on .eq u:nth-child(2){animation-delay:.2s}.mus.on .eq u:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}
@media (max-width:620px){.mus em,.tb-date{display:none}}
.replay{font:600 12px var(--f-body);border:1px solid #e3cfb4;background:#fff;color:#7a4a2a;border-radius:999px;padding:3px 11px;cursor:pointer;white-space:nowrap}
@media (max-width:620px){.replay span{display:none}}
.gobtn{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:5;font-size:16px;padding:12px 26px}
.gobtn:hover{transform:translate(-50%,-50%) translateY(-1px)}
/* PC: cả trang vừa một màn hình, mỗi game chia 2 cột (trái: hướng dẫn + lời chúc, phải: khu chơi) */
@media (min-width:900px) and (min-height:560px){
  html,body{height:100%;overflow:hidden}
  .wrap{height:100vh;max-width:1360px;padding:12px 20px 16px;gap:10px}
  .top{flex-direction:row;justify-content:center;gap:18px}
  .top h1{font-size:clamp(30px,4.2vh,42px)}
  .pc{flex:1;height:auto;min-height:0}
  .stage{padding:18px 26px;overflow:hidden}
  .scr{max-width:1200px;height:100%;overflow-y:auto}
  .gm{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:28px;height:100%}
  .scr:has(.gm){overflow:hidden}
  .gm .side{overflow-y:auto;min-height:0;padding-right:4px}
  .gm .play{min-height:0;display:flex;flex-direction:column;justify-content:safe center;overflow-y:auto;padding-bottom:4px}
  .gm .wish{margin-top:12px;padding:12px 14px}
  .gm .wish div{font-size:21px}
  .gm .guide{margin-top:10px}
  .gm .row{margin-top:12px}
  .cw{--cs:min(46px,calc((100vh - 440px)/5.6),calc((100vw - 520px)/15))}
  .keyword{margin-top:10px}
  .arena{height:min(340px,calc(100vh - 300px))}
  .road{height:calc(100vh - 330px)}
  .desk{height:auto;max-height:none;width:min(100%,calc((100vh - 210px)*4/3));align-self:center}
  .printer{width:min(680px,calc((100vh - 320px)*1.2));max-width:100%}
  .printer .dip{padding:16px 24px}
  .printer .dip p{margin-top:6px}
  .hello{margin-bottom:12px}
  .games{grid-template-columns:repeat(4,1fr)}
}

/* ================= HIỆU ỨNG ================= */
/* chuyển màn: lật trang sổ tay */
@keyframes turnIn{from{opacity:0;transform:perspective(1400px) rotateY(14deg) translateX(-18px)}}
/* màn bìa: phong bì mở ra */
.envl{position:relative;width:min(230px,56vw);aspect-ratio:3/2;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 16px 22px rgba(194,56,90,.25))}
.envl .eb{position:absolute;inset:0;border-radius:8px;background:linear-gradient(160deg,#f2c3cf,#e6a9b9)}
.envl .el{position:absolute;left:7%;right:7%;top:8%;height:84%;border-radius:5px;background:#fffaf3;z-index:2;display:grid;place-items:start center;padding-top:12%;
  font:700 clamp(18px,4vw,22px) var(--f-hand);color:#a3304d;transition:transform 1s cubic-bezier(.22,1,.36,1) .45s}
.envl .ef{position:absolute;inset:0;z-index:3;border-radius:8px;background:linear-gradient(0deg,#f6d3dc,#fff0f3);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.envl .efl{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;background:linear-gradient(180deg,#f7d6de,#eab3c1);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:8px 8px 0 0;
  transform-origin:top;transform:perspective(700px) rotateX(0);transition:transform .6s cubic-bezier(.45,0,.2,1),z-index 0s .3s}
.envl .es{position:absolute;left:50%;top:52%;width:38px;height:38px;margin:-19px 0 0 -19px;z-index:5;border-radius:50%;display:grid;place-items:center;color:#ffe3ea;font-size:17px;
  background:radial-gradient(circle at 35% 30%,#ea6d87,#c2385a 60%,#962443);box-shadow:0 3px 6px rgba(90,20,35,.35);transition:opacity .25s,transform .3s}
.envl.open{animation:none}
.envl.open .es{opacity:0;transform:scale(1.6)}
.envl.open .efl{transform:perspective(700px) rotateX(180deg);z-index:1}
.envl.open .el{transform:translateY(-62%)}
.petal{position:absolute;width:10px;height:18px;border-radius:50%;background:#fffdf5;box-shadow:0 0 0 1px rgba(200,170,120,.35);pointer-events:none;z-index:60;animation:petalOut 1.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes petalOut{from{transform:translate(-50%,-50%) rotate(var(--r)) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(calc(var(--r) + 160deg)) scale(1);opacity:0}}
/* sảnh: thẻ bay vào, dấu ĐÃ XONG, mở khoá */
.gc{animation:cardIn .65s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*90ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(-28px) rotate(calc((var(--i,0) - 1.5)*2.5deg)) scale(.9)}}
.gc.final{animation-name:cardInF}
@keyframes cardInF{from{opacity:0;transform:translateY(-20px) scale(.96)}}
.dstamp{position:absolute;right:10px;top:12px;border:3px double var(--red);color:var(--red);font:800 10.5px var(--f-body);letter-spacing:.08em;padding:3px 7px;border-radius:7px;
  transform:rotate(-14deg);opacity:.85;background:rgba(255,255,255,.85);pointer-events:none}
.dstamp.anim{opacity:0;animation:slam .45s cubic-bezier(.3,1.4,.5,1) .75s forwards}
@keyframes slam{0%{opacity:0;transform:rotate(-14deg) scale(2.8)}100%{opacity:.9;transform:rotate(-14deg) scale(1)}}
.gc.thump{animation:thump .35s .75s}
@keyframes thump{40%{transform:scale(.96)}}
.chip.unl{animation:lockshake .45s 2}
@keyframes lockshake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.gc.final.shine::after{content:"";position:absolute;inset:-2px;border-radius:17px;padding:2.5px;pointer-events:none;
  background:linear-gradient(90deg,#f2c230,#f6a3b8,#fff3c4,#f2c230);background-size:300% 100%;animation:shim 2.2s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes shim{to{background-position:300% 0}}
/* ô chữ */
.board{position:relative}
.cwr.rshake{animation:shake .4s}
.keyword{animation:none;text-shadow:0 0 22px rgba(194,56,90,.35)}
.keyword span{display:inline-block;animation:dropIn .7s cubic-bezier(.3,1.6,.5,1) var(--d) both}
@keyframes dropIn{from{opacity:0;transform:translateY(-70px) scale(1.5) rotate(-8deg)}}
.fxh{position:absolute;pointer-events:none;color:#e2486c;font-size:18px;z-index:3;animation:fxUp 1.7s ease-out forwards}
@keyframes fxUp{to{transform:translate(var(--dx,0),-130px) scale(1.5);opacity:0}}
/* đóng dấu */
.arena.shk{animation:shk .28s}
.printer.shk{animation:shk .3s}
@keyframes shk{20%{transform:translate(3px,3px)}45%{transform:translate(-3px,-2px)}70%{transform:translate(2px,1px)}}
.ink{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--red);opacity:.75;pointer-events:none;z-index:3;animation:burst .55s ease-out forwards}
.spk{position:absolute;color:#f2b51e;font-size:18px;pointer-events:none;z-index:5;text-shadow:0 0 8px rgba(242,194,48,.9);animation:burst .85s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
/* xe Hòa Lạc */
.bus.bump{animation:tilt .5s}
@keyframes tilt{20%{transform:rotate(-14deg)}45%{transform:rotate(11deg)}70%{transform:rotate(-6deg)}}
.road.flash::after{content:"";position:absolute;inset:0;z-index:4;background:rgba(255,70,70,.28);animation:flashOut .45s forwards;pointer-events:none}
@keyframes flashOut{to{opacity:0}}
.plus{position:absolute;width:33.33%;text-align:center;bottom:72px;z-index:5;font:800 18px var(--f-body);color:#fff;text-shadow:0 2px 0 #c2385a,0 0 10px #e2486c;pointer-events:none;animation:plusUp .9s ease-out forwards}
@keyframes plusUp{to{transform:translateY(-70px);opacity:0}}
.st b.pop{display:inline-block;animation:pulse .35s}
.msign{position:absolute;left:50%;top:-60px;z-index:4;transform:translateX(-50%);background:#2f7d4f;color:#fff;border:2px solid #fff;border-radius:8px;padding:6px 12px;
  font:700 13px var(--f-body);white-space:nowrap;box-shadow:0 6px 14px rgba(0,0,0,.3);animation:signDown 3.4s linear forwards;pointer-events:none}
@keyframes signDown{to{top:112%}}
.gate{animation:gateIn .9s cubic-bezier(.3,1.5,.5,1) .4s both}
@keyframes gateIn{from{opacity:0;transform:translateY(-50px) scale(.75)}}
/* bàn làm việc */
.desk.lens{cursor:none}
.loupe{position:absolute;left:var(--mx);top:var(--my);width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;z-index:8;pointer-events:none;opacity:0;transition:opacity .2s;
  border:4px solid rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(80,40,10,.35),0 0 0 2000px rgba(30,12,2,.22),inset 0 0 24px rgba(255,255,255,.35)}
.loupe::after{content:"";position:absolute;right:-30px;bottom:-14px;width:40px;height:10px;border-radius:5px;background:#6b4426;transform:rotate(45deg)}
.desk.lens .loupe{opacity:1}
.desk.fin .loupe{display:none}
.fly{position:fixed;z-index:70;pointer-events:none;line-height:1;transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .7s;transform:translate(-50%,-50%)}
.need span.pulse{animation:pulse .4s}
.giftbox{position:absolute;left:50%;top:56%;width:120px;height:110px;margin:-55px 0 0 -60px;z-index:9;animation:gbIn .55s cubic-bezier(.3,1.5,.5,1) both;transition:opacity .5s,transform .5s}
.gbody{position:absolute;left:8px;right:8px;bottom:0;height:72px;border-radius:6px;box-shadow:0 12px 22px rgba(0,0,0,.35);
  background:linear-gradient(90deg,transparent 43%,#f2c230 43% 57%,transparent 57%),linear-gradient(#e2486c,#b8304f)}
.glid{position:absolute;left:0;right:0;top:20px;height:26px;border-radius:5px;z-index:2;transition:transform .8s cubic-bezier(.3,1.2,.5,1),opacity .8s;
  background:linear-gradient(90deg,transparent 43%,#f2c230 43% 57%,transparent 57%),linear-gradient(#f0607e,#d43c66)}
.glid::before,.glid::after{content:"";position:absolute;top:-20px;left:50%;width:26px;height:22px;border:5px solid #f2c230;border-radius:60% 60% 10% 60%}
.glid::before{margin-left:-30px;transform:rotate(-20deg)}.glid::after{margin-left:4px;transform:rotate(20deg) scaleX(-1)}
.giftbox.open .glid{transform:translate(70px,-110px) rotate(50deg);opacity:0}
.giftbox.open{animation:gbShake .4s}
.giftbox.gone{opacity:0;transform:scale(.6)}
@keyframes gbIn{from{opacity:0;transform:scale(.3)}}
@keyframes gbShake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
/* in bằng */
.pr-top.busy{animation:jit .11s infinite}
@keyframes jit{50%{transform:translate(.6px,-.6px)}}
.printer .dip.out>:not(.seal):not(.foil){animation:lineIn .6s both}
.printer .dip.out>:nth-child(1){animation-delay:.3s}.printer .dip.out>:nth-child(2){animation-delay:.8s}.printer .dip.out>:nth-child(3){animation-delay:1.3s}
.printer .dip.out>:nth-child(4){animation-delay:1.7s}.printer .dip.out>:nth-child(5){animation-delay:2.2s}.printer .dip.out>:nth-child(6){animation-delay:2.7s}.printer .dip.out>:nth-child(7){animation-delay:3s}
@keyframes lineIn{from{opacity:0;filter:blur(3px)}}
.seal.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:4px solid rgba(208,38,62,.45);animation:ring .8s ease-out forwards}
@keyframes ring{to{transform:scale(1.9);opacity:0}}
.foil{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit;z-index:4}
.foil::before{content:"";position:absolute;top:-30%;bottom:-30%;left:-45%;width:32%;transform:skewX(-20deg);background:linear-gradient(100deg,transparent,rgba(255,244,210,.85),transparent)}
.dip.shine .foil::before{animation:foil 1.7s ease-in-out}
@keyframes foil{to{left:125%}}
/* lá thư: ngòi bút chạy theo chữ, chữ ký hiện dần */
.pen{display:inline-block;font-size:18px;margin-left:1px;transform:translate(1px,-5px) rotate(-8deg);animation:penb .28s ease-in-out infinite alternate}
@keyframes penb{to{transform:translate(2px,-8px) rotate(-16deg)}}
.sign.show{animation:sigIn 1.6s ease-out both}
@keyframes sigIn{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -5% -20% 0)}}

/* chống thanh cuộn chớp hiện khi có hiệu ứng (rung, phóng to, bay) */
html,body{overflow-x:hidden}
.scr,.gm .side,.gm .play{overflow-x:hidden}
@media (min-width:900px) and (min-height:560px){
  /* trên PC bố cục đã vừa một màn hình: ẩn thanh cuộn (vẫn lăn chuột được nếu màn hình quá thấp) */
  .stage,.scr,.gm .side,.gm .play{scrollbar-width:none}
  .stage::-webkit-scrollbar,.scr::-webkit-scrollbar,.gm .side::-webkit-scrollbar,.gm .play::-webkit-scrollbar{width:0;height:0}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="d"><span class="dz" aria-hidden="true">🌼</span>20 · 11 · 2026<span class="dl">Ngày Nhà giáo Việt Nam</span></div>
    <h1><span class="hl">Gửi em</span><span class="hs">–</span>người đứng sau mỗi giảng đường<span class="hb" aria-hidden="true">♥</span><svg class="sw" viewBox="0 0 400 12" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M4 8 C 90 1, 170 12, 250 6 S 360 3, 396 7"/></svg></h1>
  </header>
  <div class="pc" id="pc">
    <div class="titlebar">
      <div class="tb-l"><span class="tb-ic" aria-hidden="true">🌼</span><b>Sổ tay Đào tạo</b><em id="tb-for"></em></div>
      <div class="tb-r"><button class="mus" id="mus" aria-pressed="false" aria-label="Bật hoặc tắt nhạc nền"><b class="eq"><u></u><u></u><u></u></b><em id="muslbl">Bật nhạc</em></button><span class="tb-date">Thứ Sáu · 20.11.2026</span><button class="replay" id="replay" title="Chơi lại từ đầu">↺ <span>Chơi lại</span></button></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="cover" id="cover">
      <div class="cv-in">
        <div class="envl" id="envl" aria-hidden="true"><div class="eb"></div><div class="el">Gửi em ♥</div><div class="ef"></div><div class="efl"></div><div class="es">♥</div></div>
        <small>20 · 11 · 2026</small>
        <button class="btn big" id="openCard">Chạm để mở</button>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="ov" id="ov" aria-hidden="true">
      <div class="note" id="note"><div class="typed" id="typed"></div><div class="sign" id="sign"></div></div>
      <button class="btn close" id="close">Đóng thư</button>
    </div>
  </div>
</div>

<script>
(function(){
  /* ===== Tuỳ chỉnh ở đây ===== */
  const CFG={
    her:'Phùng Khánh Chi', short:'Chi', me:'Nguyễn Anh Nguyên',
    letter:
`Gửi em,

20/11 là ngày tri ân những người làm giáo dục. Người ta hay nhớ đến thầy cô trên bục giảng, còn anh lại nghĩ đến em, người đứng phía sau: lo từng tờ giấy báo trúng tuyển, từng phòng học được xếp ngay ngắn, từng chuyến xe lên Hòa Lạc lúc trời còn chưa sáng.

Có những tấm bằng sinh viên cầm trên tay mà chẳng ai biết em đã soát từng dòng. Có những kỳ thi trôi chảy mà chẳng ai biết em đã gỡ bao nhiêu chỗ trùng lịch.

Anh thấy hết đó, và anh tự hào về em.

Em không cầm phấn trắng, cũng không đứng trước bảng đen, nhưng sự tỉ mỉ và tâm huyết của em ở phòng Đào tạo đã lặng lẽ góp phần làm nên thành công của biết bao khoá học.

Chúc người yêu của anh một ngày 20/11 trọn vẹn niềm vui, luôn vững vàng và giữ mãi nhiệt huyết với nghề.`
  };
  const GAMES=[
    {k:'oc',e:'🔤',t:'Ô chữ hàng dọc',s:'Giải 5 hàng ngang, tìm từ khoá bí mật'},
    {k:'dd',e:'<span class="ico-stamp">♥</span>',t:'Đóng dấu',s:'Canh đúng lúc, đóng dấu vào giữa ô'},
    {k:'xe',e:'🚌',t:'Chuyến xe Hòa Lạc',s:'Lái 30 km, né ổ gà, nhặt tim'},
    {k:'bl',e:'🗂️',t:'Bàn làm việc',s:'Tìm 6 món đồ bị lạc trên bàn'}
  ];

  const $=s=>document.querySelector(s);
  const stage=$('#stage'),toastEl=$('#toast'),pc=$('#pc');
  let timers=[],cleanup=null;const later=(f,ms)=>timers.push(setTimeout(f,ms));
  const done=new Set(),results={};let lastDone=null,unlockShown=false;
  $('#tb-for').textContent='· dành riêng cho '+CFG.short;

  function toast(t){toastEl.textContent=t;toastEl.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>toastEl.classList.remove('on'),2200);}
  function confetti(n=40){const cs=['#c2385a','#f48fa9','#f2c230','#e8b04b','#7fd1b9'];
    for(let i=0;i<n;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=cs[i%cs.length];
      c.style.animationDelay=Math.random()*.5+'s';c.style.borderRadius=i%2?'50%':'2px';pc.appendChild(c);setTimeout(()=>c.remove(),3200);}}
  function show(html){sfx('page');if(cleanup){cleanup();cleanup=null;}timers.forEach(clearTimeout);timers=[];stage.scrollTop=0;stage.innerHTML=`<div class="scr">${html}</div>`;
    const b=stage.querySelector('.back');if(b)b.addEventListener('click',hub);}
  const head=(st='')=>`<div class="ghd"><button class="back">‹ Về sảnh</button><span class="st" id="st">${st}</span></div>`;
  /* lời dẫn vui sang game tiếp theo */
  const TEASE={
    oc:'Tiếp theo là <b>Ô chữ</b>. Anh có giấu một từ khoá trong đó, thử đoán xem là gì 🤫',
    dd:'Tiếp theo là <b>Đóng dấu</b>. Cả năm em đóng dấu cho người khác rồi, giờ xem tay còn chuẩn không nào 😏',
    xe:'Tiếp theo là <b>Xe Hòa Lạc</b>. Hôm nay em làm tài xế, sinh viên ngồi yên hết nha 🚌',
    bl:'Tiếp theo là <b>Bàn làm việc</b>. Bàn ai mà bừa thế nhỉ… à, bàn em đó 🙈'
  };
  const CHEER=['','Khởi động ngon lành! Xong 1/4 rồi.','2/4 rồi, đúng chuẩn cán bộ gương mẫu.','Còn đúng một việc nữa thôi, cố lên em!'];
  const RUN={oc:crossword,dd:stamp,xe:bus,bl:desk};
  // wishAt: nơi đặt lời nhắn (mặc định nằm ở cột trái cùng lời dẫn; ô chữ đặt ngay dưới từ khoá)
  function finish(k,label,wish,wishAt){
    done.add(k);results[k]=label;lastDone=k;confetti(50);
    const idx=GAMES.findIndex(g=>g.k===k);
    const next=[...GAMES.slice(idx+1),...GAMES.slice(0,idx)].find(g=>!done.has(g.k));
    const box=document.createElement('div');
    const wishHtml=`<div class="wish"><small>${label}</small><div>${wish}</div></div>`;
    if(wishAt)wishAt.insertAdjacentHTML('beforeend',wishHtml);
    box.innerHTML=(wishAt?'':wishHtml)+
      (next?`<div class="guide"><span class="gi">${next.e}</span><div><small>${CHEER[done.size]}</small><p>${TEASE[next.k]}</p></div></div>
        <div class="row"><button class="btn" id="goNext">Chơi tiếp: ${next.t} ›</button></div><div class="row" style="margin-top:4px"><button class="linkbtn" id="toHub">hoặc về sảnh chọn game khác</button></div>`
      :`<div class="guide last"><span class="gi">🎓</span><div><small>Xong cả ${GAMES.length} việc! Ca trực hôm nay hoàn thành xuất sắc.</small><p>Còn đúng một nút cuối cùng. Nút này anh để dành riêng cho em, bấm đi 👇</p></div></div>
        <div class="row"><button class="btn big" id="goPrint">🖨️ In bằng khen</button></div>`);
    const wide=matchMedia('(min-width:900px) and (min-height:560px)').matches;
    (wide&&stage.querySelector('.side')||stage.querySelector('.play')||stage.querySelector('.scr')).appendChild(box);
    if(next){$('#goNext').addEventListener('click',RUN[next.k]);$('#toHub').addEventListener('click',hub);}
    else $('#goPrint').addEventListener('click',printIt);
    later(()=>box.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
  }

  /* ===== Sảnh ===== */
  function hub(){
    const n=done.size,all=n===GAMES.length;
    show(`<div class="hello"><div class="big">🌼</div><h2>Ca trực đặc biệt ngày 20/11</h2>
      <p class="sub" style="margin:0">${all?'Em hoàn thành hết rồi! Còn một việc cuối cùng, dành riêng cho em.':`Hôm nay anh chuẩn bị ${GAMES.length} điều nhỏ, chỉ dành riêng cho em thôi. Em thích mở cái nào trước cũng được nha 💛`}</p>
      <div class="prog"><i style="width:${n/GAMES.length*100}%"></i></div><small style="color:#a08a70">${n}/${GAMES.length} việc đã xong</small></div>
      <div class="games">${GAMES.map((g,i)=>`<button class="gc ${done.has(g.k)?'done':''}${g.k===lastDone?' thump':''}" style="--i:${i}" data-k="${g.k}"><span class="e">${g.e}</span><b>${g.t}</b><small>${g.s}</small><span class="chip">${done.has(g.k)?'Đã xong ✓':'Chơi ngay'}</span>${done.has(g.k)?`<span class="dstamp${g.k===lastDone?' anim':''}">ĐÃ XONG</span>`:''}</button>`).join('')}
      <button class="gc final ${all?'':'lock'}${all&&unlockShown?' shine':''}" style="--i:${GAMES.length}" data-k="ib"><span class="e">🎓</span><b>In bằng khen</b><small>${all?'Lần này, tên trên bằng là của em':`Mở khoá khi xong cả ${GAMES.length} việc`}</small><span class="chip" id="fchip">${all&&unlockShown?'🔓 Sẵn sàng':'🔒 Khoá'}</span></button></div>`);
    if(lastDone){later(()=>sfx('thud'),780);}
    if(all&&!unlockShown){unlockShown=true;const ch=$('#fchip');
      later(()=>{ch.classList.add('unl');sfx('tick');},1300);
      later(()=>{ch.classList.remove('unl');ch.textContent='🔓 Sẵn sàng';stage.querySelector('.gc.final').classList.add('shine');sfx('chime');},2300);}
    lastDone=null;
    stage.querySelectorAll('.gc').forEach(b=>b.addEventListener('click',()=>{
      if(b.classList.contains('lock')){toast(`🔒 Xong cả ${GAMES.length} việc trước đã nha`);return;}
      (b.dataset.k==='ib'?printIt:RUN[b.dataset.k])();}));
  }

  /* ===== 1. Ô chữ hàng dọc ===== */
  const OC=[
    {w:'TUYENSINH',k:2,c:'Mùa cao điểm cả phòng thức khuya đối chiếu hồ sơ',o:['NHẬP HỌC','TUYỂN SINH','KHAI GIẢNG'],a:1},
    {w:'BANGDIEM',k:6,c:'Sinh viên hay nhắn: “Chị ơi bao giờ có … ạ?”',o:['HỌC BỔNG','LỊCH THI','BẢNG ĐIỂM'],a:2},
    {w:'CONDAU',k:5,c:'Tròn, đỏ, đóng xuống là có hiệu lực',o:['CON DẤU','CHỮ KÝ','PHÔI BẰNG'],a:0},
    {w:'SINHVIEN',k:6,c:'Những người em lo từng phòng thi, từng chuyến xe',o:['GIẢNG VIÊN','SINH VIÊN','HỌC VIÊN'],a:1},
    {w:'DIEMDANH',k:3,c:'Việc đầu tiên mỗi sáng trên xe lên Hòa Lạc',o:['ĂN SÁNG','XẾP HÀNG','ĐIỂM DANH'],a:2}
  ];
  function crossword(){
    const KC=Math.max(...OC.map(r=>r.k)),cols=Math.max(...OC.map(r=>KC-r.k+r.w.length));
    show(`<div class="gm"><div class="side">${head('Hàng <b id="ri">1</b>/'+OC.length)}<h2>Ô chữ hàng dọc</h2><p class="sub">Giải 5 hàng ngang, cột hồng ở giữa sẽ hiện ra một từ khoá bí mật.</p>
      <div id="clue"></div></div><div class="play"><div class="board"><div class="cw" style="--cols:${cols}">${OC.map((r,i)=>{const off=KC-r.k;
        return `<div class="cwr" id="r${i}"><span class="n">${i+1}</span>${Array.from({length:cols},(_,c)=>c>=off&&c<off+r.w.length?`<div class="cell${c===KC?' k':''}"><span>${r.w[c-off]}</span></div>`:'<div class="cell empty"></div>').join('')}</div>`;}).join('')}</div>
      <div id="kw"></div></div></div></div>`);
    let i=0;
    const ask=()=>{
      stage.querySelectorAll('.cwr').forEach((r,j)=>r.classList.toggle('cur',j===i));$('#ri').textContent=i+1;
      const r=OC[i];
      $('#clue').innerHTML=`<div class="clue"><p><small>Hàng ${i+1} · ${r.w.length} chữ cái</small><br>${r.c}</p><div class="opts">${r.o.map((o,j)=>`<button data-j="${j}">${o}</button>`).join('')}</div></div>`;
      $('#clue').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
        if(+b.dataset.j!==r.a){b.classList.remove('no');void b.offsetWidth;b.classList.add('no');const rw=$('#r'+i);rw.classList.remove('rshake');void rw.offsetWidth;rw.classList.add('rshake');sfx('wrong');toast('Chưa vừa ô rồi, đếm lại số chữ cái nha 😄');return;}
        $('#clue').innerHTML='';
        $('#r'+i).querySelectorAll('.cell:not(.empty)').forEach((c,j)=>later(()=>{c.classList.add('show');sfx('tick');},j*70));
        i++;later(()=>i<OC.length?ask():reveal(),r.w.length*70+450);
      }));
    };
    const reveal=()=>{
      stage.querySelectorAll('.cwr').forEach(r=>r.classList.remove('cur'));
      const board=stage.querySelector('.board');
      stage.querySelectorAll('.cell.k').forEach((c,j)=>later(()=>{c.classList.add('glow');sfx('sparkle');
        // tim bay lên từ ô vừa sáng
        const br=board.getBoundingClientRect(),cr=c.getBoundingClientRect();
        for(let h=0;h<3;h++){const f=document.createElement('span');f.className='fxh';f.textContent='♥';
          f.style.left=(cr.left-br.left+cr.width/2-6+(h-1)*10)+'px';f.style.top=(cr.top-br.top)+'px';f.style.setProperty('--dx',(h-1)*18+'px');f.style.animationDelay=h*.12+'s';
          board.appendChild(f);setTimeout(()=>f.remove(),2200);}
      },j*350));
      later(()=>{$('#clue').innerHTML='';sfx('chime');
        $('#kw').innerHTML=`<div class="keyword">${'YÊU EM'.split('').map((ch,j)=>`<span style="--d:${j*.13}s">${ch===' '?'&nbsp;':ch}</span>`).join('')}</div>`;
        finish('oc','Từ khoá bí mật','Đây là điều anh muốn nói với em mỗi ngày, kể cả những ngày em bận đến quên cả mình.',$('#kw'));},OC.length*350+400);
    };
    ask();
  }

  /* ===== 2. Đóng dấu ===== */
  function stamp(){
    const P=[['Giấy báo trúng tuyển',2.4],['Lịch thi học kỳ I',3],['Bảng điểm toàn khoá',3.6],['Quyết định tốt nghiệp',4.2],['Bằng khen · '+CFG.her,2.2]];
    show(`<div class="gm"><div class="side">${head('Tờ <b id="pi">1</b>/'+P.length)}<h2>Đóng dấu</h2><p class="sub">Chạm vào khung, bấm nút hoặc phím Space đúng lúc ô tròn chạy tới giữa để đóng dấu.</p>
      <div class="log" id="log"></div></div>
      <div class="play"><div class="arena" id="ar"><div class="aim"></div><div class="stp" id="stp"><div class="hd"></div><div class="bs"></div></div><button class="btn gobtn" id="start">Bắt đầu</button></div>
      <div class="row"><button class="btn" id="hit" disabled>Đóng dấu!</button></div><div id="ddw"></div></div></div>`);
    const ar=$('#ar'),stp=$('#stp'),kept=[];let combo=0,idx=0,x=-180,sheet=null,busy=false,raf=0,last=0,perfect=0;
    const newSheet=()=>{sheet=document.createElement('div');sheet.className='sheet';
      sheet.innerHTML=`<b>${P[idx][0]}</b><i style="width:80%"></i><i style="width:60%"></i><div class="tg"></div>`;ar.appendChild(sheet);x=-180;busy=false;$('#pi').textContent=idx+1;};
    const loop=t=>{const dt=last?Math.min(50,t-last):16;last=t;
      if(!busy&&sheet){x+=P[idx][1]*dt/16;if(x>ar.clientWidth+10)x=-180;sheet.style.left=x+'px';}
      raf=requestAnimationFrame(loop);};
    const hit=()=>{
      if(busy||!sheet)return;busy=true;stp.classList.add('hit');
      const d=Math.abs((x+85)-ar.clientWidth/2);
      later(()=>{
        const m=document.createElement('div');m.className='mark';m.innerHTML='ĐÃ<br>DUYỆT<br>♥';
        m.style.left=(ar.clientWidth/2-x-30)+'px';m.style.transform=`rotate(${(Math.random()*24-12)|0}deg)`;sheet.appendChild(m);
        let [txt,cls]=d<10?['Perfect! ✨','p']:d<28?['Đẹp lắm!','']:d<55?['Hơi lệch xíu','']:['Lệch rồi 😝',''];
        if(cls){perfect++;combo++;if(combo>1)txt=`Perfect ×${combo}! ✨`;}else combo=0;
        // cảm giác "đã tay": rung khung, mực bắn, Perfect thì pháo sáng vàng
        sfx('thud');ar.classList.remove('shk');void ar.offsetWidth;ar.classList.add('shk');
        const mx=ar.clientWidth/2-x,my=86;
        for(let q=0;q<9;q++){const dot=document.createElement('i');dot.className='ink';const a=Math.random()*6.283,dd=30+Math.random()*28;
          dot.style.left=mx+'px';dot.style.top=my+'px';dot.style.setProperty('--dx',Math.cos(a)*dd+'px');dot.style.setProperty('--dy',Math.sin(a)*dd+'px');
          sheet.appendChild(dot);setTimeout(()=>dot.remove(),600);}
        if(cls){sfx('sparkle');for(let q=0;q<12;q++){const sp=document.createElement('i');sp.className='spk';sp.textContent='✦';const a=q/12*6.283,dd=60+Math.random()*40;
          sp.style.left=ar.clientWidth/2+'px';sp.style.top=(96+my)+'px';sp.style.setProperty('--dx',Math.cos(a)*dd+'px');sp.style.setProperty('--dy',Math.sin(a)*dd+'px');
          ar.appendChild(sp);setTimeout(()=>sp.remove(),900);}}
        const r=document.createElement('div');r.className='rate';r.textContent=txt;ar.appendChild(r);setTimeout(()=>r.remove(),900);
        $('#log').insertAdjacentHTML('beforeend',`<span class="${cls}">${idx+1}. ${txt.replace(/[✨😝!]/g,'').trim()}</span>`);
        stp.classList.remove('hit');
      },150);
      later(()=>{const s=sheet;const keep=s.cloneNode(true);keep.querySelectorAll('.rate').forEach(r=>r.remove());kept.push(keep);
        s.classList.add('out');setTimeout(()=>s.remove(),500);idx++;sheet=null;
        if(idx<P.length)later(newSheet,450);
        else{cancelAnimationFrame(raf);$('#hit').closest('.row').hidden=true;
          // xếp 5 tờ đã đóng dấu thành một xấp xoè ra, tờ bằng khen nằm trên cùng ở giữa
          ar.classList.add('fin');const pile=document.createElement('div');pile.className='pile';ar.appendChild(pile);
          const k=Math.min(1,ar.clientWidth/720),OFF=[-190,-95,95,190,0],ANG=[-12,-6,6,12,0];
          kept.forEach((sh,j)=>{sh.style.left='';sh.style.setProperty('--t',`translate(calc(-50% + ${OFF[j]*k}px),-50%) rotate(${ANG[j]}deg)`);
            sh.style.animationDelay=j*.12+'s';pile.appendChild(sh);});
          finish('dd',`Đóng dấu xong · ${perfect}/${P.length} Perfect`,'Chúc mọi giấy tờ em làm đều suôn sẻ, đóng dấu một lần là xong, không bao giờ phải làm lại.',$('#ddw'));}},1100);
    };
    ar.addEventListener('pointerdown',hit);$('#hit').addEventListener('click',hit);
    const key=e=>{if(e.code==='Space'){e.preventDefault();hit();}};document.addEventListener('keydown',key);
    $('#start').addEventListener('click',e=>{e.stopPropagation();e.currentTarget.remove();$('#hit').disabled=false;newSheet();last=0;raf=requestAnimationFrame(loop);});
    $('#start').addEventListener('pointerdown',e=>e.stopPropagation());
    cleanup=()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',key);};
  }

  /* ===== 3. Chuyến xe Hòa Lạc ===== */
  function bus(){
    show(`<div class="gm"><div class="side">${head('💗 <b id="hc">0</b>')}<h2>Chuyến xe Hòa Lạc</h2><p class="sub">Rê chuột hoặc kéo ngón tay trên đường để lái xe (dùng phím mũi tên, nút ◀ ▶ cũng được). Né 🚧 🚗, nhặt 💗 🧋. Va chạm chỉ làm xe chậm lại thôi.</p></div>
      <div class="play"><div class="kmbar"><span>Hà Nội</span><span id="km">Km 0 / 30</span><span>Hòa Lạc</span></div><div class="kmp"><i id="kmp"></i></div>
      <div class="roadwrap" id="rw"><div class="road" id="road"><div class="ln a"></div><div class="ln b"></div><div class="bus" id="bus">🚌</div><button class="btn gobtn" id="go">Xuất phát</button>
        <div class="gate" id="gate" hidden><div class="gs">🏫 HÒA LẠC</div></div></div></div>
      <div class="ctl"><button id="L" aria-label="Sang trái">◀</button><button id="R" aria-label="Sang phải">▶</button></div></div></div>`);
    const road=$('#road'),busEl=$('#bus');let lane=1,km=0,hearts=0,obs=[],raf=0,last=0,spawn=0,slow=0,running=false;
    const setLane=l=>{lane=Math.max(0,Math.min(2,l));busEl.style.left=lane*33.33+'%';};setLane(1);
    const BAD=['🚧','🚗'],GOOD=['💗','🧋'],MS=[{km:10,t:'🛣️ Đại lộ Thăng Long'},{km:20,t:'📍 Hòa Lạc · còn 10 km'}];
    const loop=t=>{const dt=last?Math.min(50,t-last):16;last=t;
      const sp=slow>0?.45:1;slow=Math.max(0,slow-dt);
      km+=dt/1000*sp;spawn-=dt;

        const o={el,lane:(Math.random()*3)|0,y:-6,good,hit:false};el.textContent=(good?GOOD:BAD)[(Math.random()*2)|0];el.style.left=o.lane*33.33+'%';road.appendChild(el);obs.push(o);}
      obs=obs.filter(o=>{o.y+=dt/1000*38*sp;o.el.style.top=o.y+'%';
        if(!o.hit&&o.lane===lane&&o.y>80&&o.y<94){o.hit=true;
          if(o.good){hearts++;const hc=$('#hc');hc.textContent=hearts;hc.classList.remove('pop');void hc.offsetWidth;hc.classList.add('pop');sfx('ding');
            const pl=document.createElement('div');pl.className='plus';pl.textContent='+1 💗';pl.style.left=lane*33.33+'%';road.appendChild(pl);setTimeout(()=>pl.remove(),950);
            o.el.remove();return false;}
          slow=900;busEl.classList.remove('bump');void busEl.offsetWidth;busEl.classList.add('bump');road.classList.remove('flash');void road.offsetWidth;road.classList.add('flash');sfx('bump');toast(o.el.textContent==='🚧'?'Ổ gà! Từ từ thôi em':'Kẹt xe rồi, chậm lại xíu');}
        if(o.y>110){o.el.remove();return false;}return true;});
      const k=Math.min(30,km);$('#km').textContent=`Km ${k|0} / 30`;$('#kmp').style.width=k/30*100+'%';
      MS.forEach(m=>{if(!m.shown&&km>=m.km){m.shown=true;sfx('tick');const sg=document.createElement('div');sg.className='msign';sg.textContent=m.t;road.appendChild(sg);setTimeout(()=>sg.remove(),3500);}});
      if(km>=30){running=false;road.classList.remove('go');$('#rw').classList.remove('go');obs.forEach(o=>o.el.remove());obs=[];
        // cảnh đến nơi: xe chạy vào giữa đường, biển Hòa Lạc hiện ra, ẩn nút điều khiển
        setLane(1);road.classList.add('arrive');later(()=>sfx('beep'),900);$('#gate').hidden=false;stage.querySelector('.ctl').hidden=true;
        finish('xe',`Đến nơi an toàn · nhặt được ${hearts} 💗 dọc đường`,'Chúc mỗi chuyến đi của em đều bình an. Đi xa mấy cũng được, cuối ngày luôn có anh chờ em về.',$('#gate'));return;}
      raf=requestAnimationFrame(loop);};
    $('#go').addEventListener('click',()=>{$('#go').hidden=true;running=true;road.classList.add('go');$('#rw').classList.add('go');last=0;raf=requestAnimationFrame(loop);});
    $('#L').addEventListener('click',()=>setLane(lane-1));$('#R').addEventListener('click',()=>setLane(lane+1));
    // xe chạy theo vị trí chuột / ngón tay: chia đường làm 3 làn, con trỏ ở làn nào thì xe sang làn đó
    const follow=e=>{if(road.classList.contains('arrive'))return;const r=road.getBoundingClientRect();setLane(Math.floor((e.clientX-r.left)/r.width*3));};
    road.addEventListener('pointerdown',e=>{if(e.target.id==='go')return;if(e.pointerType!=='mouse')road.setPointerCapture(e.pointerId);follow(e);});
    road.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||road.hasPointerCapture(e.pointerId))follow(e);});
    const key=e=>{if(e.key==='ArrowLeft'){e.preventDefault();setLane(lane-1);}if(e.key==='ArrowRight'){e.preventDefault();setLane(lane+1);}};
    document.addEventListener('keydown',key);
    cleanup=()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',key);};
  }

  /* ===== Nền: cúc họa mi + lá vàng rơi, thỉnh thoảng một chiếc máy bay giấy ===== */
  const sky=$('#sky'),g=sky.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,P=[],planes=[];const golds=['#e8b04b','#d98e3a','#f0c766','#c9772f','#e3a25a'];
  const mk=top=>{const k=Math.random()<.55?'daisy':'leaf';
    return {k,x:Math.random()*W,y:top?Math.random()*H:-20,s:k==='daisy'?5+Math.random()*4:7+Math.random()*7,vy:.3+Math.random()*.55,
      sw:Math.random()*6.28,sws:.008+Math.random()*.012,rot:Math.random()*6.28,vr:(Math.random()-.5)*(k==='leaf'?.05:.015),
      c:golds[(Math.random()*golds.length)|0],a:k==='daisy'?.75+Math.random()*.25:.45+Math.random()*.4};};
  const mkPlane=()=>({x:-40,y:H*(.25+Math.random()*.6),vx:1.1+Math.random()*.6,vy:-(.25+Math.random()*.3),t:Math.random()*6.28});
  function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;sky.width=W*r;sky.height=H*r;g.setTransform(r,0,0,r,0,0);P=Array.from({length:Math.round(Math.min(60,Math.max(22,W*H/22000)))},()=>mk(true));}
  function daisy(s){g.fillStyle='#fffdf7';g.strokeStyle='rgba(200,180,140,.35)';g.lineWidth=.6;
    for(let i=0;i<12;i++){g.save();g.rotate(i*.5236);g.beginPath();g.ellipse(0,-s*.95,s*.22,s*.7,0,0,6.28);g.fill();g.stroke();g.restore();}
    g.fillStyle='#f2c230';g.beginPath();g.arc(0,0,s*.38,0,6.28);g.fill();g.fillStyle='rgba(190,130,20,.45)';g.beginPath();g.arc(s*.08,s*.1,s*.2,0,6.28);g.fill();}
  function leaf(s,c){g.fillStyle=c;g.beginPath();g.moveTo(0,-s);g.bezierCurveTo(s*.75,-s*.45,s*.6,s*.55,0,s);g.bezierCurveTo(-s*.6,s*.55,-s*.75,-s*.45,0,-s);g.fill();
    g.strokeStyle='rgba(120,60,10,.35)';g.lineWidth=1;g.beginPath();g.moveTo(0,-s*.85);g.lineTo(0,s*1.25);g.stroke();}
  function plane(p){g.save();g.translate(p.x,p.y+Math.sin(p.t)*8);g.rotate(-.28+Math.cos(p.t)*.06);g.globalAlpha=.85;
    g.fillStyle='#fff';g.strokeStyle='rgba(80,100,150,.45)';g.lineWidth=1;g.lineJoin='round';
    g.beginPath();g.moveTo(22,0);g.lineTo(-14,-9);g.lineTo(-6,0);g.closePath();g.fill();g.stroke();
    g.fillStyle='#e9edf7';g.beginPath();g.moveTo(22,0);g.lineTo(-6,0);g.lineTo(-10,8);g.closePath();g.fill();g.stroke();g.restore();}
  function tick(){g.clearRect(0,0,W,H);
    P.forEach((p,i)=>{p.y+=p.vy;p.sw+=p.sws;p.rot+=p.vr;if(p.y>H+30)P[i]=p=mk(false);
      g.save();g.translate(p.x+Math.sin(p.sw)*12,p.y);g.rotate(p.rot);g.globalAlpha=p.a;p.k==='daisy'?daisy(p.s):leaf(p.s,p.c);g.restore();});
    if(planes.length<1&&Math.random()<.004)planes.push(mkPlane());
    planes=planes.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.t+=.03;plane(p);return p.x<W+50&&p.y>-50;});
    if(!reduce)requestAnimationFrame(tick);}
  addEventListener('resize',size);size();tick();

  /* ===== Nhạc nền: bản valse tự soạn, Rê trưởng, nhịp 3/4 =====
     Đoạn A (8 ô nhịp): giai điệu ngũ cung nhẹ nhàng, hoài niệm như những bài hát về mái trường, thầy cô.
     Đoạn B (8 ô nhịp): giai điệu đi lên, cao trào ở ô 13, có tiếng hộp nhạc lấp lánh, như một bản tình ca.
     Tiếng piano mềm + đệm valse (bass – hợp âm – hợp âm) + nền dây ấm. Phát bằng Web Audio, bắt đầu sau lần chạm đầu tiên. */
  const M={ctx:null,master:null,bus:null,on:false,userOff:false,step:0,next:0,timer:null};
  const mt=n=>440*Math.pow(2,(n-69)/12);
  // [nốt bass, thứ?] cho 16 ô nhịp: D Bm G A | D Bm Em A || G A F#m Bm | G A D D
  const CH=[[50,0],[47,1],[43,0],[45,0],[50,0],[47,1],[40,1],[45,0],
            [43,0],[45,0],[42,1],[47,1],[43,0],[45,0],[50,0],[50,0]];
  // giai điệu: mỗi ô nhịp 6 móc đơn, [nốt, độ dài tính bằng móc đơn], 0 = nghỉ
  const MEL=[
    [[69,3],[66,1],[69,2]], [[71,3],[69,1],[66,2]], [[71,2],[74,2],[71,2]], [[69,6]],
    [[66,3],[64,1],[66,2]], [[69,3],[66,1],[62,2]], [[64,2],[66,2],[67,2]], [[64,6]],
    [[71,3],[74,1],[76,2]], [[78,4],[76,2]],        [[76,3],[73,1],[69,2]], [[74,4],[71,2]],
    [[71,2],[74,2],[79,2]], [[78,3],[76,3]],        [[74,6]],               [[0,6]]
  ];
  const STEPS=CH.length*6,EV=Array.from({length:STEPS},()=>[]);
  MEL.forEach((bar,bi)=>{let pos=0;bar.forEach(([n,len])=>{if(n)EV[bi*6+pos].push({n,len,bi});pos+=len;});});
  function piano(f,t,dur,vol){
    const c=M.ctx,g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(4200,f*6);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(vol*0.45,t+0.35);g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.9);
    [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12],[1.003,'sine',.5]].forEach(([m,type,a])=>{
      const o=c.createOscillator(),og=c.createGain();o.type=type;o.frequency.value=f*m;og.gain.value=a;
      o.connect(og).connect(lp);o.start(t);o.stop(t+dur+1);});
    lp.connect(g).connect(M.bus);
  }
  function bell(f,t,dur,vol){
    const c=M.ctx,g=c.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    const o=c.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g).connect(M.bus);o.start(t);o.stop(t+dur+0.05);
  }
  function pad(root,minor,t,dur){
    const c=M.ctx;[0,minor?3:4,7,12].forEach(iv=>{
      const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.value=mt(root+12+iv);o.detune.value=(Math.random()-.5)*10;
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
      g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.007,t+0.9);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.4);
      o.connect(lp).connect(g).connect(M.bus);o.start(t);o.stop(t+dur+0.5);});
  }
  function schedule(){
    const E=60/84/2;   // valse 84 nhịp/phút, tính theo móc đơn
    while(M.next<M.ctx.currentTime+0.35){
      const st=M.step%STEPS,bi=Math.floor(st/6),pos=st%6,[root,minor]=CH[bi],t=M.next,third=minor?3:4;
      if(pos===0){piano(mt(root),t,E*5,0.11);pad(root,minor,t,E*6);}
      if(pos===2||pos===4)[12,12+third,19].forEach(iv=>piano(mt(root+iv),t,E*1.6,0.028));
      EV[st].forEach(({n,len,bi})=>{
        piano(mt(n),t,E*len,0.16);
        if(bi>=8)bell(mt(n+12),t,1.4,0.022);   // đoạn tình ca: thêm tiếng hộp nhạc lấp lánh
      });
      M.step++;M.next+=E;
    }
  }
  function initAudio(){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    const c=M.ctx=new AC();M.master=c.createGain();M.master.gain.value=0.0001;M.master.connect(c.destination);
    M.bus=c.createGain();const dry=c.createGain();dry.gain.value=0.75;
    const rev=c.createConvolver(),len=c.sampleRate*2.6,ir=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
    rev.buffer=ir;const wet=c.createGain();wet.gain.value=0.45;
    M.bus.connect(dry).connect(M.master);M.bus.connect(rev).connect(wet).connect(M.master);
    M.next=c.currentTime+0.1;return true;
  }
  const musBtn=$('#mus'),musLbl=$('#muslbl');
  function musicOn(){
    try{
      if(!M.ctx&&!initAudio())return;
      M.ctx.resume();M.on=true;
      if(M.next<M.ctx.currentTime)M.next=M.ctx.currentTime+0.1;
      if(!M.timer)M.timer=setInterval(schedule,90);
      M.master.gain.cancelScheduledValues(M.ctx.currentTime);
      M.master.gain.setValueAtTime(Math.max(M.master.gain.value,0.0001),M.ctx.currentTime);
      M.master.gain.exponentialRampToValueAtTime(0.5,M.ctx.currentTime+2.5);
      musBtn.classList.add('on');musBtn.setAttribute('aria-pressed','true');musLbl.textContent='Đang phát';
    }catch(e){}
  }
  function musicOff(){
    if(!M.ctx)return;M.on=false;
    M.master.gain.cancelScheduledValues(M.ctx.currentTime);
    M.master.gain.setValueAtTime(Math.max(M.master.gain.value,0.0001),M.ctx.currentTime);
    M.master.gain.exponentialRampToValueAtTime(0.0001,M.ctx.currentTime+0.6);
    setTimeout(()=>{if(!M.on){clearInterval(M.timer);M.timer=null;M.ctx.suspend();}},700);
    musBtn.classList.remove('on');musBtn.setAttribute('aria-pressed','false');musLbl.textContent='Bật nhạc';
  }
  musBtn.addEventListener('pointerdown',e=>e.stopPropagation());
  musBtn.addEventListener('click',e=>{e.stopPropagation();if(M.on){M.userOff=true;musicOff();}else{M.userOff=false;musicOn();}});

  /* ===== Hiệu ứng âm thanh nhỏ (tự tạo bằng Web Audio), chỉ phát khi nhạc đang bật ===== */
  function noiseBuf(){if(M.nb)return M.nb;const c=M.ctx,b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return M.nb=b;}
  function sfx(k){
    if(!M.ctx||!M.on)return;
    try{
      const c=M.ctx,t=c.currentTime+0.01,out=c.createGain();out.gain.value=0.8;out.connect(c.destination);
      const tone=(f,f2,dur,vol,type='sine',at=0)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t+at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+at+dur);
        g.gain.setValueAtTime(0.0001,t+at);g.gain.exponentialRampToValueAtTime(vol,t+at+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+at+dur);o.connect(g).connect(out);o.start(t+at);o.stop(t+at+dur+0.05);};
      const noise=(dur,vol,ft,f,f2,at=0,q=1)=>{const s=c.createBufferSource();s.buffer=noiseBuf();s.loop=true;const fl=c.createBiquadFilter();fl.type=ft;fl.Q.value=q;
        fl.frequency.setValueAtTime(f,t+at);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+at+dur);
        const g=c.createGain();g.gain.setValueAtTime(0.0001,t+at);g.gain.exponentialRampToValueAtTime(vol,t+at+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+at+dur);
        s.connect(fl).connect(g).connect(out);s.start(t+at);s.stop(t+at+dur+0.05);};
      switch(k){
        case 'thud':tone(150,45,.28,.5);noise(.14,.25,'lowpass',900,200);break;          // con dấu "cộp"
        case 'ding':tone(1318,0,.35,.16);tone(1760,0,.45,.12,'sine',.07);break;            // nhặt tim "ting"
        case 'bump':tone(95,40,.3,.4,'triangle');noise(.22,.18,'lowpass',500,120);break;   // va chạm
        case 'pop':tone(520,980,.12,.2);break;                                             // tìm thấy đồ
        case 'tick':tone(1900,0,.05,.04);break;
        case 'wrong':tone(230,150,.25,.14,'triangle');break;
        case 'page':noise(.32,.07,'bandpass',900,3200,0,.8);break;                          // lật trang
        case 'open':noise(.5,.12,'bandpass',600,2600,0,.7);tone(880,0,.7,.07,'sine',.35);tone(1175,0,.8,.06,'sine',.45);break;
        case 'chime':[74,78,81,86].forEach((n,i)=>tone(mt(n),0,1.3,.1,'sine',i*.12));break;
        case 'sparkle':[88,91,95].forEach((n,i)=>tone(mt(n),0,.45,.05,'sine',i*.05));break;
        case 'beep':tone(660,0,.16,.07,'square');tone(660,0,.24,.07,'square',.24);break;   // còi xe "bíp bíp"
        case 'whirr':noise(3.3,.05,'bandpass',1400,1700,0,3);for(let i=0;i<10;i++)noise(.1,.04,'highpass',4000,0,i*.33);break; // máy in "rè rè"
      }
    }catch(e){}
  }
  /* màn bìa: chạm "Mở thiệp" là bật nhạc (trình duyệt chỉ cho phát tiếng sau một lần chạm của người xem) */
  const cover=$('#cover');
  $('#openCard').addEventListener('click',e=>{
    const btn=e.currentTarget;if(btn.dataset.go)return;btn.dataset.go=1;
    if(!M.userOff)musicOn();sfx('open');
    // cánh cúc họa mi bung ra quanh nút
    const r=btn.getBoundingClientRect(),cr=cover.getBoundingClientRect();
    for(let i=0;i<16;i++){const pt=document.createElement('i');pt.className='petal';const a=i/16*6.283,d=90+Math.random()*80;
      pt.style.left=(r.left-cr.left+r.width/2)+'px';pt.style.top=(r.top-cr.top+r.height/2)+'px';
      pt.style.setProperty('--dx',Math.cos(a)*d+'px');pt.style.setProperty('--dy',Math.sin(a)*d+'px');pt.style.setProperty('--r',(a*57)+'deg');cover.appendChild(pt);}
    $('#envl').classList.add('open');
    setTimeout(()=>{cover.classList.add('off');setTimeout(()=>cover.remove(),700);},1500);
  });
  // phòng hờ: nếu vì lý do gì nhạc chưa bật thì lần chạm kế tiếp sẽ bật
  ['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{if(!M.on&&!M.userOff&&!M.ctx)musicOn();},{once:true}));

  hub();
})();
</script>
</body>
</html>
